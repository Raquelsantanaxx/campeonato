<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BoraVôlei</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="main-content">

    <!-- HERO -->
    <div class="hero-text">
        <h1 class="brand">BoraVôlei</h1>
        <h2 class="subtitle">
            Gestão de Campeonatos <br>
            Esportivos de Vôlei
        </h2>
    </div>

    <!-- LOGIN -->
    <div class="login-container">
        <div class="login-card">

            <div class="logo">
                <img th:src="@{/img/trofeu2.png}" alt="Logo Troféu">
            </div>

            <form th:action="@{/login}" method="post">

                <h2>Entrar</h2>

                <!-- EMAIL -->
                <input type="text"
                       name="username"
                       placeholder="Email"
                       required>

                <!-- SENHA -->
                <input type="password"
                       name="password"
                       placeholder="Senha"
                       required>

                <!-- LEMBRAR -->
                <label class="remember">
                    <input type="checkbox" name="remember-me">
                    Lembrar-me
                </label>

                <!-- BOTÃO -->
                <button type="submit">Entrar</button>

                <!-- ERRO -->
                <p th:if="${param.error}" class="error">
                    Usuário ou senha inválidos
                </p>

                <!-- LOGOUT -->
                <p th:if="${param.logout}" class="success">
                    Logout realizado com sucesso
                </p>

                <!-- LINK CADASTRO -->
                <p class="login-link">
                    Ainda não tem conta?
                    <a th:href="@{/cadastro}">Criar conta</a>
                </p>

            </form>
        </div>
    </div>

</div>

</body>
</html>
