<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-privado :: layout(~{::section})}">

<section class="form-container">

    <div class="form-card">

        <div class="form-header">
            <div>
                <h2 th:text="${campeonato.id != null} ? 'Editar Campeonato' : 'Cadastrar Campeonato'">
                    Cadastrar Campeonato
                </h2>
                <p class="subtitulo">Informe os dados do campeonato</p>
            </div>

            <a th:href="@{/campeonatos}" class="btn-voltar">← Voltar</a>
        </div>

        <!-- FORMULÁRIO CORRETO -->
        <form th:action="@{/campeonatos}"
              th:object="${campeonato}"
              method="post"
              class="form">

            <!-- ID OCULTO (ESSENCIAL PARA UPDATE) -->
            <input type="hidden" th:field="*{id}" />

            <div class="campo">
                <label>Nome do Campeonato</label>
                <input type="text" th:field="*{nome}" required>
            </div>

            <div class="campo">
                <label>Formato</label>
                <select th:field="*{formato}">
                    <option value="">Selecione</option>
                    <option value="PONTOS_CORRIDOS">Pontos Corridos</option>
                    <option value="MATA_MATA">Mata-mata</option>
                </select>
            </div>

            <div class="linha">
                <div class="campo">
                    <label>Data Início</label>
                    <input type="date" th:field="*{dataInicio}" required>
                </div>

                <div class="campo">
                    <label>Data Fim</label>
                    <input type="date" th:field="*{dataFim}">
                </div>
            </div>

            <button type="submit" class="btn-salvar">
                Salvar Campeonato
            </button>

        </form>

    </div>

</section>
</html>
