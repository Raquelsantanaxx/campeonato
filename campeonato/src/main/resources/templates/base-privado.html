<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <title>Sistema</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/campeonatos.css}">
    <link rel="stylesheet" th:href="@{/css/equipes.css}">
    <link rel="stylesheet" th:href="@{/css/jogadores-form.css}">
    <link rel="stylesheet" th:href="@{/css/partidas.css}">
    <link rel="stylesheet" th:href="@{/css/rodadas.css}">
    <link rel="stylesheet" th:href="@{/css/classificacao.css}">
</head>

<body>

<header class="header">
    <div class="logo">
        <img th:src="@{/img/bolaDeVolei2.png}" alt="Gestão de Vôlei">
        <span>BoraVôlei</span>
    </div>

    <nav class="menu">
        <a th:href="@{/campeonatos}">
            Campeonatos
        </a>
        <a href="/equipes">Equipes</a>
        <a th:href="@{/jogadores}">Jogadores</a>
        <!-- BOTÃO ENTRAR -->
        <a th:href="@{/logout}" class="btn-sair">
            Sair
        </a>
    </nav>
</header>

<main class="conteudo">
    <!-- AQUI É O PONTO CRÍTICO -->
    <section th:replace="${content}"></section>
</main>

</body>
</html>
