<div xmlns:th="http://www.thymeleaf.org"
     th:replace="~{base-privado :: layout(~{::section})}">

    <section class="lista-container">

        <!-- 🔔 MENSAGENS (ADICIONADO) -->
        <div th:if="${erro}"
             class="alerta alerta-erro"
             th:text="${erro}">
        </div>

        <div th:if="${sucesso}"
             class="alerta alerta-sucesso"
             th:text="${sucesso}">
        </div>

        <div class="lista-header">
            <div>
                <h2>👥 Equipes</h2>

                <!-- MOSTRA NOME DO CAMPEONATO SE EXISTIR -->
                <p class="subtitulo"
                   th:if="${campeonato != null}"
                   th:text="'Campeonato: ' + ${campeonato.nome}">
                </p>
            </div>

            <div style="display:flex; gap:10px;">

                <!-- BOTÃO VOLTAR (SE VEIO DE CAMPEONATO) -->
                <a th:if="${campeonato != null}"
                   th:href="@{/campeonatos/{id}(id=${campeonato.id})}"
                   class="btn-nova-equipe">
                    ← Voltar
                </a>

                <!-- BOTÃO VOLTAR (SE VEIO DA LISTA GERAL) -->
                <a th:if="${campeonato == null}"
                   th:href="@{/campeonatos}"
                   class="btn-nova-equipe">
                    ← Voltar
                </a>

                <!-- NOVA EQUIPE -->
                <a th:if="${campeonato != null
                           and campeonato.organizador != null
                           and usuarioLogado != null
                           and usuarioLogado.equals(campeonato.organizador.email)}"
                   th:href="@{/equipes/novo/{id}(id=${campeonato.id})}"
                   class="btn-nova-equipe">
                    + Nova Equipe
                </a>

            </div>
        </div>

        <!-- CASO NÃO TENHA EQUIPES -->
        <div th:if="${equipes == null or equipes.isEmpty()}"
             class="estado-vazio">
            Nenhuma equipe cadastrada.
        </div>

        <!-- TABELA -->
        <table th:if="${equipes != null and !equipes.isEmpty()}"
               class="tabela-equipes">

            <thead>
            <tr>
                <th>Equipe</th>
                <th>Sigla</th>
                <th>Campeonato</th>
                <th>Cores</th>
                <th class="acoes-tabela">Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="equipe : ${equipes}">

                <td class="nome-equipe"
                    th:text="${equipe.nome}"></td>

                <td th:text="${equipe.sigla}"></td>

                <td th:text="${equipe.campeonato != null
                              ? equipe.campeonato.nome
                              : 'Sem campeonato'}"></td>

                <td>
                    <span class="cor-bolinha"
                          th:if="${equipe.corPrimaria != null}"
                          th:style="'background:' + ${equipe.corPrimaria}">
                    </span>

                    <span class="cor-bolinha"
                          th:if="${equipe.corSecundaria != null}"
                          th:style="'background:' + ${equipe.corSecundaria}">
                    </span>
                </td>

                <!-- AÇÕES -->
                <td class="acoes-tabela"
                    th:if="${usuarioLogado != null
                        and equipe.campeonato != null
                        and equipe.campeonato.organizador != null
                        and usuarioLogado.equals(equipe.campeonato.organizador.email)}">

                    <a th:href="@{/equipes/editar/{id}(id=${equipe.id})}"
                       class="btn-acao btn-editar">
                        Editar
                    </a>

                    <form th:action="@{/equipes/excluir/{id}(id=${equipe.id})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit"
                                class="btn-acao btn-excluir">
                            Excluir
                        </button>
                    </form>

                    <a th:href="@{/jogadores/equipe/{id}(id=${equipe.id})}"
                       class="btn-acao btn-jogador"
                       title="Gerenciar Jogadores">
                        👤
                    </a>

                </td>

            </tr>
            </tbody>
        </table>

    </section>
</div>
